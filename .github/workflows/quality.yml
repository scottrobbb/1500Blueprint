name: Quality and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run reviewed native setup scripts only
        run: npm rebuild esbuild unrs-resolver
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Last, and advisory. npm's quick-audit endpoint is being retired and
      # answers 4xx/5xx on its own schedule; ahead of the build that turned
      # every registry hiccup into a red run with nothing actually verified.
      # A real advisory still shows up in the job log and the step summary.
      - name: Audit dependencies (advisory)
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Report audit outcome
        if: steps.audit.outcome == 'failure'
        run: echo "::warning::npm audit reported findings or could not be reached -- see the audit step above." >> "$GITHUB_STEP_SUMMARY"
